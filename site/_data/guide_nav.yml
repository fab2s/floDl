# Single source of truth for guide navigation.
#
# This file defines the guide's groups, their order, and their members. Three
# things are DERIVED from it and must never be hand-maintained again:
#
#   1. site/_includes/sidebar.html  — group folds + links + chapter numbers
#   2. each page's prev/next        — injected into site/guide/*.md by build_guide.py
#   3. docs/README.md               — the GitHub-side index and reading order
#
# Before this file existed, all three were separate hand-kept lists (plus the
# NN- filename prefixes), and they had already drifted: a tutorial's nav label
# named a doc by a title it no longer had, and the chapter number was stored
# three times (filename, H1, sidebar).
#
# Fields per group:
#   label     — sidebar heading
#   fold      — render as a collapsible <details> group
#   open      — fold's default state when it holds no active page
#   numbered  — prefix members with their 1-based position in the sidebar
#   members   — ordered; each has `stub` (basename in site/_stubs/) and `title`
#
# `title` here is the sidebar/nav label. The page's own <h1> comes from the
# source markdown; permalinks live in the stubs.

groups:
  - label: "Coming from PyTorch"
    fold: true
    open: true
    numbered: false
    members:
      - stub: "porting"
