---
layout: default
---

<div class="guide-layout">
  {% include sidebar.html %}
  <main class="guide-content content">
    {{ content }}

    {% if page.prev_url or page.next_url %}
    <div class="page-nav">
      {% if page.prev_url %}
      <a href="{{ page.prev_url | relative_url }}">
        <span class="label">&larr; Previous</span>
        <span class="title">{{ page.prev_title }}</span>
      </a>
      {% endif %}
      {% if page.next_url %}
      <a href="{{ page.next_url | relative_url }}" class="next">
        <span class="label">Next &rarr;</span>
        <span class="title">{{ page.next_title }}</span>
      </a>
      {% endif %}
    </div>
    {% endif %}
  </main>
</div>

<!-- Mermaid: render ```mermaid fences as diagrams, matching GitHub's
     native rendering of the same docs/ sources. kramdown+rouge emit
     them as plain code blocks (div.language-mermaid > pre > code or
     pre > code.language-mermaid); this rewrites those into
     <pre class="mermaid"> and loads mermaid only when the page
     actually carries one. Styles live in assets/css/style.css.

     Rendered diagrams then become click/tap-to-enlarge: fitting a wide
     diagram to the text column shrinks its labels past legibility, so the
     full-size view opens in a modal <dialog>. -->
<script type="module">
  const blocks = document.querySelectorAll(
    'div.language-mermaid pre > code, pre > code.language-mermaid'
  );
  if (blocks.length) {
    const { default: mermaid } = await import(
      'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'
    );
    for (const code of blocks) {
      const holder = document.createElement('pre');
      holder.className = 'mermaid';
      holder.textContent = code.textContent;
      // Replace the whole highlighter wrapper when rouge added one.
      const wrapper = code.closest('div.language-mermaid') || code.closest('pre');
      wrapper.replaceWith(holder);
    }
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
    await mermaid.run({ querySelector: '.mermaid' });
    enableDiagramZoom();
  }

  function enableDiagramZoom() {
    // One <dialog> reused by every diagram. showModal() gives top-layer
    // rendering, ::backdrop, Esc-to-close and focus handling for free.
    const dialog = document.createElement('dialog');
    dialog.className = 'diagram-modal';
    dialog.setAttribute('aria-label', 'Enlarged diagram');
    const surface = document.createElement('div');
    surface.className = 'diagram-modal-surface';
    const close = document.createElement('button');
    close.className = 'diagram-modal-close';
    close.type = 'button';
    close.setAttribute('aria-label', 'Close diagram');
    close.textContent = '×';
    dialog.append(close, surface);
    document.body.append(dialog);

    // The SVG is MOVED, not cloned. mermaid references its own arrowhead and
    // marker defs by `url(#id)`; a clone would put duplicate ids in the
    // document and those references resolve to the first match, so a cloned
    // diagram can lose or borrow the wrong markers. Moving sidesteps it, and
    // the node goes back to its holder on close.
    let home = null, svg = null, inlineStyle = null;

    function open(holder) {
      svg = holder.querySelector('svg');
      if (!svg) return;
      home = holder;
      inlineStyle = svg.getAttribute('style');
      svg.removeAttribute('style');
      surface.append(svg);
      dialog.showModal();
    }

    function restore() {
      if (!svg || !home) return;
      if (inlineStyle === null) svg.removeAttribute('style');
      else svg.setAttribute('style', inlineStyle);
      home.prepend(svg);
      svg = home = inlineStyle = null;
    }

    // `close` fires for the button, Esc, and dialog.close() alike.
    dialog.addEventListener('close', restore);
    close.addEventListener('click', () => dialog.close());
    // Click anywhere in the view to dismiss - standard lightbox behaviour.
    surface.addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (e) => { if (e.target === dialog) dialog.close(); });

    for (const holder of document.querySelectorAll('.mermaid')) {
      if (!holder.querySelector('svg')) continue;   // render failed; leave it alone
      holder.dataset.zoomable = '';
      holder.setAttribute('role', 'button');
      holder.setAttribute('tabindex', '0');
      holder.setAttribute('aria-label', 'Enlarge diagram');
      const hint = document.createElement('span');
      hint.className = 'mermaid-hint';
      hint.textContent = 'Click to enlarge';
      holder.append(hint);
      holder.addEventListener('click', () => open(holder));
      holder.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(holder); }
      });
    }
  }
</script>
