[package]
name = "ddp-bench"
version = "0.0.1"
edition = "2024"
publish = false

[features]
default = []
gpu = ["flodl/gpu"]
cuda = ["gpu", "flodl/cuda"]
rocm = ["gpu", "flodl/rocm"]

[dependencies]
flodl = { path = "../flodl" }
flodl-cli = { path = "../flodl-cli" }
flate2 = "1"
tar = "0.4"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
