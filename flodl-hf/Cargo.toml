[package]
name = "flodl-hf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HuggingFace integration for flodl: safetensors, hub, tokenizers, pre-built models"
readme = "README.md"
keywords = ["huggingface", "transformers", "safetensors", "deep-learning", "flodl"]
categories = ["science", "artificial-intelligence"]
include = [
    "src/**/*",
    "examples/*.rs",
    "tests/*.rs",
    "tests/common/**/*",
    "README.md",
    "LICENSE",
    "Cargo.toml",
]
# tests/fixtures/ excluded: ~15 MB of safetensors parity fixtures used by
# `_live` tests against the PyTorch reference. Tests run from source
# checkouts, not from the published crate, so the fixtures don't need to
# ship and would push the package past crates.io's 10 MB upload limit.

[features]
default = ["hub", "tokenizer"]
gpu = ["flodl/gpu"]
cuda = ["gpu", "flodl/cuda"]
rocm = ["gpu", "flodl/rocm"]
hub = ["hf-hub", "dep:flodl-cli"]
tokenizer = ["tokenizers"]

[dependencies]
flodl.workspace = true
safetensors.workspace = true
serde_json.workspace = true
hf-hub = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
# Optional, gated behind `hub`: lets the export_hf CLI binary use the
# FdlArgs derive so its --help output matches what `fdl flodl-hf export
# -h` renders. Pure-Rust dep; pulls no libtorch.
flodl-cli = { workspace = true, optional = true }

[[example]]
name = "bert_embed"
required-features = ["hub", "tokenizer"]

[[example]]
name = "bert_classify"
required-features = ["hub", "tokenizer"]

[[example]]
name = "bert_ner"
required-features = ["hub", "tokenizer"]

[[example]]
name = "bert_qa"
required-features = ["hub", "tokenizer"]

[[example]]
name = "roberta_embed"
required-features = ["hub", "tokenizer"]

[[example]]
name = "roberta_classify"
required-features = ["hub", "tokenizer"]

[[example]]
name = "roberta_ner"
required-features = ["hub", "tokenizer"]

[[example]]
name = "roberta_qa"
required-features = ["hub", "tokenizer"]

[[example]]
name = "distilbert_embed"
required-features = ["hub", "tokenizer"]

[[example]]
name = "distilbert_classify"
required-features = ["hub", "tokenizer"]

[[example]]
name = "distilbert_ner"
required-features = ["hub", "tokenizer"]

[[example]]
name = "distilbert_qa"
required-features = ["hub", "tokenizer"]

[[example]]
name = "distilbert_finetune"
required-features = ["hub", "tokenizer"]

[[example]]
name = "distilbert_finetune_ddp"
required-features = ["hub", "tokenizer"]

[[example]]
name = "auto_classify"
required-features = ["hub", "tokenizer"]

[[example]]
name = "export_hf"
required-features = ["hub"]

[package.metadata.docs.rs]
all-features = true
# `--cfg docsrs` as rustdoc-arg ONLY. Passing it via rustc-args
# propagates to every dep compile including serde, tripping
# serde 1.0.228's broken `cfg(all(docsrs, if_docsrs_then_no_serde_core))`
# path. Real docs.rs only applies the cfg at doc time.
rustdoc-args = ["--cfg", "docsrs"]
