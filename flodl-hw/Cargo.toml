[package]
name = "flodl-hw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Hardware detection for flodl: GPUs and host RAM, with no libtorch and no CUDA runtime"
readme = "README.md"
keywords = ["gpu", "detection", "nvidia", "hardware", "flodl"]
