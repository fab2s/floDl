# Deliberately dependency-free. This crate sits on the `cargo install
# flodl-cli` path AND inside `flodl`, and it must build on a host that
# has no libtorch, no CUDA toolkit and no GPU. Every probe is a
# std-only filesystem read or a bounded subprocess.
