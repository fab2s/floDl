services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: flodl-dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
      - ./.cargo-cache:/usr/local/cargo/registry
      - ./.cargo-git:/usr/local/cargo/git
      - ./.cargo-credentials.toml:/usr/local/cargo/credentials.toml
      - ${LIBTORCH_CPU_PATH:-./libtorch/precompiled/cpu}:/usr/local/libtorch:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    # Container hostname inherits the host's hostname so the cluster
    # launcher matches `cluster.hosts[i].name == hostname()` (otherwise
    # the container ID is used and the host is "not in cluster.hosts").
    hostname: ${HOSTNAME}
    environment:
      - FLODL_VERBOSITY
      # Cluster envelope: when fdl-cli activates a `cluster: true`
      # command, these are set on the controller process so the
      # spawned user binary's `flodl::launcher::dispatch` detects
      # launcher role and fans out. Bare names = pass-through from
      # the docker compose caller's env (the fdl-cli process).
      - FLODL_FULL_CLUSTER_JSON
      - FLODL_FDL_CMD
      - FDL_ENV
      - FLODL_PREBUILD_PER_HOST
      # Controller's user name (host-side). Read by the launcher inside
      # the container as the default `ssh -l <user>` target when the
      # per-host `ssh_user:` is unset — bridges container's stock
      # `ubuntu` (UID 1000) identity vs. the user's actual remote
      # account.
      - FLODL_HOST_USER
      # Share the hf-hub cache with the hf-parity service so `fdl test-live`
      # reuses fixtures downloaded by `fdl flodl-hf parity bert*`. Repo-local,
      # gitignored, survives container rebuild.
      - HF_HOME=/workspace/.hf-cache

  cuda:
    build:
      context: .
      dockerfile: Dockerfile.cuda
      args:
        CUDA_VERSION: ${CUDA_VERSION:-12.8.0}
    image: flodl-cuda:${CUDA_TAG:-12.8}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
      - ./.cargo-cache-cuda:/usr/local/cargo/registry
      - ./.cargo-git-cuda:/usr/local/cargo/git
      - ./.cargo-credentials.toml:/usr/local/cargo/credentials.toml
      - ${LIBTORCH_HOST_PATH:-./libtorch/precompiled/cu128}:/usr/local/libtorch:ro
      # SSH-agent socket forwarded so the launcher can ssh into remote
      # cluster hosts. Falls back to /dev/null when the user has no
      # agent running — ssh then errors loudly inside the container,
      # which is the right signal for non-cluster runs.
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    working_dir: /workspace
    stdin_open: true
    tty: true
    # NCCL falls back to SHM transport when GPUs lack peer-to-peer (no NVLink,
    # separate PCIe slots — the consumer-rig case). 3-GPU heterogeneous DDP on
    # any non-trivial model exhausts Docker's default 64 MB /dev/shm. 2 GB is
    # generous headroom for ResNet-class workspaces.
    shm_size: 2gb
    # Container hostname inherits the host's hostname so the cluster
    # launcher matches `cluster.hosts[i].name == hostname()` (otherwise
    # the container ID is used and the host is "not in cluster.hosts").
    hostname: ${HOSTNAME}
    # Share the host's network namespace so the cluster controller +
    # coord (bound on exa-side ports) are reachable from remote rank
    # VMs. Docker's default bridge isolates the container from the
    # host's other networks (virbr0, enp1s0, etc.); with
    # `network_mode: host` the container sees every interface the
    # host has, and `master_addr` resolves identically inside and
    # outside the container.
    network_mode: host
    environment:
      - FLODL_VERBOSITY
      # Cluster envelope: when fdl-cli activates a `cluster: true`
      # command, these are set on the controller process so the
      # spawned user binary's `flodl::launcher::dispatch` detects
      # launcher role and fans out. Bare names = pass-through from
      # the docker compose caller's env (the fdl-cli process).
      - FLODL_FULL_CLUSTER_JSON
      - FLODL_FDL_CMD
      - FDL_ENV
      - FLODL_PREBUILD_PER_HOST
      # Controller's user name (host-side). Read by the launcher inside
      # the container as the default `ssh -l <user>` target when the
      # per-host `ssh_user:` is unset — bridges container's stock
      # `ubuntu` (UID 1000) identity vs. the user's actual remote
      # account.
      - FLODL_HOST_USER
      # SSH-agent forwarding: launcher SSHes into remote cluster hosts
      # from inside this container. The host's agent socket is bind-
      # mounted at /ssh-agent (see volumes:) and re-exposed via
      # SSH_AUTH_SOCK so ssh-add'ed keys work without copying private
      # material into the image. Run `eval $(ssh-agent) && ssh-add` on
      # the host before `fdl @cluster ...`.
      - SSH_AUTH_SOCK=/ssh-agent
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: flodl-bench
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
      - ./.cargo-cache-bench:/usr/local/cargo/registry
      - ./.cargo-git-bench:/usr/local/cargo/git
      - ${LIBTORCH_HOST_PATH:-./libtorch/precompiled/cu128}:/usr/local/libtorch:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    # See `cuda` service: NCCL SHM transport on multi-GPU heterogeneous setups
    # exhausts the 64 MB Docker default /dev/shm.
    shm_size: 2gb
    # Container hostname inherits the host's hostname so the cluster
    # launcher matches `cluster.hosts[i].name == hostname()` (otherwise
    # the container ID is used and the host is "not in cluster.hosts").
    hostname: ${HOSTNAME}
    # Share the host's network namespace so the cluster controller +
    # coord (bound on exa-side ports) are reachable from remote rank
    # VMs. Docker's default bridge isolates the container from the
    # host's other networks (virbr0, enp1s0, etc.); with
    # `network_mode: host` the container sees every interface the
    # host has, and `master_addr` resolves identically inside and
    # outside the container.
    network_mode: host
    environment:
      - FLODL_VERBOSITY
      # Cluster envelope: when fdl-cli activates a `cluster: true`
      # command, these are set on the controller process so the
      # spawned user binary's `flodl::launcher::dispatch` detects
      # launcher role and fans out. Bare names = pass-through from
      # the docker compose caller's env (the fdl-cli process).
      - FLODL_FULL_CLUSTER_JSON
      - FLODL_FDL_CMD
      - FDL_ENV
      - FLODL_PREBUILD_PER_HOST
      # Controller's user name (host-side). Read by the launcher inside
      # the container as the default `ssh -l <user>` target when the
      # per-host `ssh_user:` is unset — bridges container's stock
      # `ubuntu` (UID 1000) identity vs. the user's actual remote
      # account.
      - FLODL_HOST_USER
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  docs-rs:
    image: rust:latest
    volumes:
      - .:/workspace
      - ./.cargo-cache-docsrs:/usr/local/cargo/registry
      - ./.cargo-git-docsrs:/usr/local/cargo/git
      - ./.target-docsrs:/opt/target
    working_dir: /workspace/flodl
    environment:
      - CARGO_TARGET_DIR=/opt/target
      - DOCS_RS=1

  hf-parity:
    build:
      context: flodl-hf/scripts
      dockerfile: Dockerfile.parity
    image: flodl-hf-parity
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
    working_dir: /workspace/flodl-hf
    environment:
      - HF_HOME=/workspace/.hf-cache

  jekyll:
    image: jekyll/jekyll:4
    volumes:
      - ./site:/srv/jekyll
      - jekyll-bundle:/usr/local/bundle
    ports:
      - "4000:4000"
    command: bash -c "bundle install && jekyll serve --watch --force_polling --livereload"
    environment:
      - JEKYLL_ENV=development

volumes:
  jekyll-bundle:
