name: Release CLI

# Build and upload pre-compiled flodl-cli binaries on every tagged release.
# The `fdl` bootstrap script downloads these binaries so end users never
# need Rust installed.
#
# Trigger: push a tag like `0.3.0` (no `v` prefix, matching existing convention).

on:
  push:
    tags: ['[0-9]*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # PINNED, and the pin is the point. A dynamically linked
          # binary cannot run on a system whose glibc is older than the
          # one it was built against, so the build base is a FLOOR on
          # who can use the release. `ubuntu-latest` floats: the day
          # GitHub moves it, that floor rises silently and the binary
          # stops running on older distributions with no code change and
          # no release note. Raise this deliberately or not at all --
          # the gate below fails the build if the floor moves.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: flodl-cli-linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: flodl-cli-linux-aarch64

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: flodl-cli-darwin-arm64

          # Native Windows ships `fdl` as a libtorch fetcher and WSL
          # signpost, not as a build driver: flodl-sys has never been built
          # against MSVC and NCCL has no Windows port, so training lives in
          # WSL2. See docs/windows-wsl.md.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: flodl-cli-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cross-compilation toolchain for Linux aarch64
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          # Linker for aarch64 cross-compilation
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p flodl-cli --target ${{ matrix.target }}

      # Rename binary to artifact name
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/fdl ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          copy target\${{ matrix.target }}\release\fdl.exe ${{ matrix.artifact }}

      # The floor, asserted rather than assumed. A released binary that
      # silently demands a newer glibc than the last release stops
      # running on distributions we claim to support, and nothing else
      # in this pipeline would notice: it builds, it uploads, and it
      # fails on the user's machine with a symbol-version error. RHEL 9
      # (glibc 2.34) is below this floor today, which is a known
      # limitation and the reason the number is written down.
      - name: Glibc floor
        if: startsWith(matrix.target, 'x86_64-unknown-linux')
        run: |
          FLOOR=2.39
          MAX=$(objdump -p ${{ matrix.artifact }} \
                | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1 | sed 's/GLIBC_//')
          echo "artifact needs at most GLIBC_$MAX (declared floor $FLOOR)"
          if [ "$(printf '%s\n%s\n' "$FLOOR" "$MAX" | sort -V | tail -1)" != "$FLOOR" ]; then
            echo "::error::this build needs GLIBC_$MAX, above the declared floor $FLOOR."
            echo "The build base moved. Either pin it back, or raise FLOOR here"
            echo "deliberately and say so in the release notes -- it drops users."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Collect all binaries into a flat list
          FILES=""
          for dir in artifacts/*/; do
            for file in "$dir"*; do
              [ -f "$file" ] && FILES="$FILES $file"
            done
          done

          # Create release (or upload to existing one)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" \
              --title "floDl $TAG" \
              --generate-notes \
              $FILES
          fi
