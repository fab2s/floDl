<script>
/* Pre-paint theme resolution, same key and attribute as the site, the live
   dashboard and fdl ui: localStorage('flodl-theme') -> prefers-color-scheme
   -> dark. */
(function(){
  let t = null;
  try { t = localStorage.getItem('flodl-theme'); } catch(e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

<style>
/* flodl design tokens -- begin */
/* floDl design tokens: one palette across the site, the live dashboard
   and fdl ui. Colour marks a ROLE, matching the mermaid convention in
   CLAUDE.md: indigo = an actor, green = a good/cheap state, amber = a
   cost/hazard. Dark-first, light via prefers-color-scheme.
   Canonical home: site/assets/css/flodl-tokens.css. Consumers vendor
   this file verbatim between the marker comments;
   ci/release/13-design-tokens.sh fails on drift. */
:root {
  --bg: #12161d;
  --panel: #1a2028;
  --line: #2a323d;
  --ink: #d7dee8;
  --muted: #8b96a5;
  --actor: #7986cb;
  --good: #66bb6a;
  --cost: #d9a05b;
  --prompt-bg: #0d1117;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
/* Light rides data-theme, not a media query: the shared pre-paint
   script resolves localStorage('flodl-theme') -> prefers-color-scheme
   -> dark, and the toggle flips the attribute. Same key, same
   attribute as the site and the live dashboard, so every surface
   aligns (the proxied dashboard even shares the ui's origin, hence
   the very same stored value). */
:root[data-theme="light"] {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --line: #d9dfe7;
  --ink: #26303b;
  --muted: #5f6b79;
  --actor: #5c6bc0;
  --good: #2e7d32;
  --cost: #8a5320;
  --prompt-bg: #eceff3;
}
/* flodl design tokens -- end */

<div class="header">

<div id="tooltip"></div>

<script>
'use strict';

// ===========================================================================
// Data source, two modes. Injected consts (save_html) make the static
// artifact. Served at /timeline?host=<h>, the page instead fetches the
// shipped JSONL stream from /timeline/data and auto-refreshes every 10s
// while visible — the shipper's clock, so "live" honestly means "within
// one shipping tick".
// ===========================================================================
let S = [], E = [], R = [], HOST = null;
let totalMs = 1;
let M = null;

/// Spill/shipped stream lines are byte-identical to timeline.json's array
/// elements; the discriminant is the stream contract ("k" = event, "rank"
/// = rank sample, neither = poller sample).
function parseJsonl(text){
  const s = [], e = [], r = [];
  for (const line of text.split('\n')){
    if (!line) continue;
    let o;
    try { o = JSON.parse(line); } catch(err) { continue; } // torn tail line
    if ('k' in o) e.push(o);
    else if ('rank' in o) r.push(o);
    else s.push(o);
  }
  return {s, e, r};
}

function setData(s, e, r, host){
  const oldTotal = totalMs;
  const wasFullView = view.t0 <= 1 && view.t1 >= oldTotal - 1;
  S = s; E = e; R = r; HOST = host;
  totalMs = Math.max(
    S.length ? S[S.length-1].t : 0,
    E.length ? E[E.length-1].t : 0,
    R.length ? R[R.length-1].t : 0,
  ) || 1;
  // A zoomed view survives a refresh; a full view follows the new end.
  if (wasFullView) view = {t0:0, t1:totalMs};
  else view = {t0:Math.min(view.t0, totalMs), t1:Math.min(view.t1, totalMs)};
  M = computeModel();
}

// ===========================================================================
// Series colors. Fixed assignment per entity (never cycled), two theme
// variants like the dashboard's COLORS_DARK/COLORS_LIGHT. Roles follow the
// house palette where one applies: sync/idle shading are cost/hazard tints.
// ===========================================================================
// Co-strip pairs are CVD-checked (dataviz validator): cpu/ram and
// sync/cpu-avg were indigo/purple (protan dE 2.0) and light va/vu two
// near-identical browns (dE 0.9) before the re-step below. Purple moved
// to vram-used, pink to ram and cpu-avg; hues that never share a strip
// may repeat (each strip is its own identity space, legend-named).
const SERIES_DARK = {util:'#34d399', va:'#fbbf24', vu:'#a78bfa', cpu:'#6c8cff', ram:'#f472b6',
  anchor:'#fb923c', syncMs:'#6c8cff', avgMs:'#f472b6', d:'#f87171', lambda:'#67e8f9',
  loss:'#6c8cff', lr:'#34d399'};
const SERIES_LIGHT = {util:'#0e9968', va:'#8f5b10', vu:'#6e4ad0', cpu:'#3656c7', ram:'#b83280',
  anchor:'#b4530c', syncMs:'#3656c7', avgMs:'#b83280', d:'#c93c3c', lambda:'#0b7b95',
  loss:'#3656c7', lr:'#0e9968'};
function seriesColor(k){
  return (document.documentElement.getAttribute('data-theme')==='light'?SERIES_LIGHT:SERIES_DARK)[k];
}
const SHADE = {
  sync:    'rgba(217,160,91,0.12)',
  cpu_avg: 'rgba(167,139,250,0.10)',
  idle:    'rgba(248,113,113,0.12)',
};
const KIND_META = [
  // [key, label, color key or literal, default-enabled]
  ['epoch',          'epoch',          'good',   true],
  ['sync',           'sync',           'cost',   true],
  ['cpu_avg',        'cpu avg',        '#a78bfa',true],
  ['anchor',         'anchor',         '#fb923c',true],
  ['throttle',       'throttle',       '#f87171',true],
  ['meta_nudge',     'meta nudge',     '#67e8f9',true],
  ['lost_broadcast', 'lost broadcast', '#f87171',true],
  ['div',            'divergence',     'muted',  true],
  ['guard_telemetry','guard',          'muted',  false],
  ['div_epoch',      'div/epoch',      'muted',  true],
];
function kindColor(spec){
  if (spec==='good'||spec==='cost'||spec==='muted'||spec==='actor')
    return getComputedStyle(document.documentElement).getPropertyValue('--'+spec).trim();
  return spec;
}

// ===========================================================================
// Pure data preparation (DOM-free).
// ===========================================================================

/// Map an event's `k` onto its toggle family.
function kindFamily(k){
  if (k==='epoch_start'||k==='epoch_end') return 'epoch';
  if (k==='sync_start'||k==='sync_end') return 'sync';
  if (k==='cpu_avg_start'||k==='cpu_avg_end') return 'cpu_avg';
  if (k==='idle') return null; // rendered as shading, not a tick
  return k;
}

/// Pair `X_start`/`X_end` events in arrival order into [t0, t1, endEvent].
function pairSpans(events, startK, endK){
  const spans = []; let open = null;
  for (const e of events){
    if (e.k===startK) open = e.t;
    else if (e.k===endK && open!==null){ spans.push([open, e.t, e]); open = null; }
  }
  if (open!==null) spans.push([open, open, null]); // unterminated: zero-width
  return spans;
}

/// A piecewise-constant series from anchor events: value holds until the
/// next change. Seeded with the first event's `from` so the pre-change
/// level is drawn too.
function anchorSteps(events){
  const pts = [];
  for (const e of events){
    if (e.k!=='anchor') continue;
    if (!pts.length) pts.push({t:0, v:e.from});
    pts.push({t:e.t, v:e.to});
  }
  return pts;
}

/// Per-pixel-column min/max/mean envelope of a (t, v) series over [t0, t1]
/// across `w` columns. Never loses a spike: every sample lands in exactly
/// one column, and a column reports the extremes of what fell in it.
function envelope(ts, vs, t0, t1, w){
  const lo = new Float64Array(w).fill(Infinity);
  const hi = new Float64Array(w).fill(-Infinity);
  const sum = new Float64Array(w);
  const cnt = new Uint32Array(w);
  const span = t1 - t0 || 1;
  // Binary search the window start; samples are time-ordered.
  let i = lowerBound(ts, t0);
  if (i > 0) i--; // one sample of margin so lines enter from the edge
  for (; i < ts.length && ts[i] <= t1 + span/w; i++){
    const v = vs[i];
    if (v===null || v===undefined || Number.isNaN(v)) continue;
    let c = Math.floor((ts[i]-t0)/span * w);
    if (c < 0) c = 0; if (c >= w) c = w-1;
    if (v < lo[c]) lo[c] = v;
    if (v > hi[c]) hi[c] = v;
    sum[c] += v; cnt[c]++;
  }
  return {lo, hi, sum, cnt};
}

function lowerBound(arr, x){
  let a = 0, b = arr.length;
  while (a < b){ const m = (a+b)>>1; if (arr[m] < x) a = m+1; else b = m; }
  return a;
}

/// GPU idle gaps from the local poller samples: consecutive util < 5%
/// lasting >= 200 ms, per device.
function idleGaps(samples, device){
  const gaps = []; let start = null; let lastT = 0;
  for (const s of samples){
    const g = s.gpus && s.gpus.find(g => g.d===device);
    if (!g) continue;
    lastT = s.t;
    if (g.u < 5){ if (start===null) start = s.t; }
    else if (start!==null){ if (s.t-start >= 200) gaps.push([start, s.t]); start = null; }
  }
  if (start!==null && lastT-start >= 200) gaps.push([start, lastT]);
  return gaps;
}

/// Group rank samples into per-(host, rank) sparse series.
function rankSeries(rankSamples){
  const map = new Map();
  for (const s of rankSamples){
    const key = `${s.host||'?'} r${s.rank}`;
    if (!map.has(key)) map.set(key, {host:s.host, rank:s.rank, t:[], cpu:[], ramPct:[], gpus:new Map()});
    const e = map.get(key);
    e.t.push(s.t);
    e.cpu.push(s.cpu!==undefined ? s.cpu : null);
    e.ramPct.push(s.ram_used!==undefined && s.ram_total ? s.ram_used/s.ram_total*100 : null);
    for (const g of (s.gpus||[])){
      if (!e.gpus.has(g.d)) e.gpus.set(g.d, {u:[], vaPct:[], vt:g.vt||null});
      const gg = e.gpus.get(g.d);
      // Backfill so all per-gpu arrays stay index-aligned with e.t.
      while (gg.u.length < e.t.length-1){ gg.u.push(null); gg.vaPct.push(null); }
      gg.u.push(g.u!==undefined ? g.u : null);
      gg.vaPct.push(g.va!==undefined && g.vt ? g.va/g.vt*100 : null);
      if (g.vt) gg.vt = g.vt;
    }
    for (const gg of e.gpus.values()){
      while (gg.u.length < e.t.length){ gg.u.push(null); gg.vaPct.push(null); }
    }
  }
  return map;
}

// ===========================================================================
// Prepared model, recomputed from (S, E, R) on every setData.
// ===========================================================================
function computeModel(){
  const t = S.map(s=>s.t);
  const gpuIds = [...new Set(S.flatMap(s=>(s.gpus||[]).map(g=>g.d)))].sort((a,b)=>a-b);
  const gpu = {};
  for (const d of gpuIds){
    gpu[d] = {
      t, // shared clock
      u:    S.map(s=>{const g=(s.gpus||[]).find(x=>x.d===d); return g?g.u:null;}),
      vaPct:S.map(s=>{const g=(s.gpus||[]).find(x=>x.d===d); return g&&g.vt?g.va/g.vt*100:null;}),
      vuPct:S.map(s=>{const g=(s.gpus||[]).find(x=>x.d===d); return g&&g.vt?g.vu/g.vt*100:null;}),
      vt:   (S.find(s=>(s.gpus||[]).some(x=>x.d===d&&x.vt))||{gpus:[]}).gpus.find(x=>x.d===d)?.vt||null,
      idle: idleGaps(S, d),
    };
  }
  const ev = k => E.filter(e=>e.k===k);
  return {
    t,
    cpu: S.map(s=>s.cpu),
    ramPct: S.map(s=>s.ram[1] ? s.ram[0]/s.ram[1]*100 : null),
    ramTotal: S.length ? S[0].ram[1] : null,
    gpuIds, gpu,
    syncSpans: pairSpans(E,'sync_start','sync_end'),
    avgSpans:  pairSpans(E,'cpu_avg_start','cpu_avg_end'),
    anchor: anchorSteps(E),
    syncMs: ev('sync_end').map(e=>({t:e.t, v:e.ms})),
    avgMs:  ev('cpu_avg_end').map(e=>({t:e.t, v:e.ms})),
    d:      ev('div').map(e=>({t:e.t, v:e.d, ev:e})),
    lambda: ev('div').filter(e=>e.lambda_ema!==undefined).map(e=>({t:e.t, v:e.lambda_ema})),
    loss:   ev('epoch_end').map(e=>({t:e.t, v:e.loss, epoch:e.epoch})),
    lr:     ev('epoch_end').map(e=>({t:e.t, v:e.lr})),
    epochStarts: ev('epoch_start'),
    guardKeys: [...new Set(ev('guard_telemetry').flatMap(e=>Object.keys(e.values||{})))].sort(),
    guard: key => ev('guard_telemetry').filter(e=>e.values && e.values[key]!==undefined)
                    .map(e=>({t:e.t, v:e.values[key]})),
    ranks: rankSeries(R),
  };
}

// ===========================================================================
// Formatting.
// ===========================================================================
function fmtMs(ms){
  if (ms >= 3600000) return (ms/3600000).toFixed(2)+'h';
  if (ms >= 60000) return (ms/60000).toFixed(1)+'m';
  if (ms >= 1000) return (ms/1000).toFixed(1)+'s';
  return Math.round(ms)+'ms';
}
function fmtBytes(b){
  if (b===null||b===undefined) return '?';
  if (b >= 1e9) return (b/1e9).toFixed(1)+' GB';
  if (b >= 1e6) return (b/1e6).toFixed(0)+' MB';
  if (b >= 1e3) return (b/1e3).toFixed(0)+' KB';
  return b+' B';
}
function fmtVal(v){
  if (v===null||v===undefined) return '?';
  const a = Math.abs(v);
  if (a!==0 && (a<1e-3 || a>=1e5)) return v.toExponential(2);
  return +v.toFixed(4)+'';
}

// ===========================================================================
// Strips: each is one measure on one axis. A strip declares how to draw its
// data and what the tooltip should say at a time t.
// ===========================================================================
const DPR = window.devicePixelRatio || 1;
let view = {t0:0, t1:totalMs};
const strips = [];  // {canvas, ctx, h, draw, tip, label}
let cursorT = null;
const kindEnabled = {};

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function addStrip(parent, name, opts){
  const div = document.createElement('div');
  div.className = 'strip';
  const label = document.createElement('div');
  label.className = 'strip-label';
  let legendHtml = '';
  if (opts.legend && opts.legend.length > 1){
    legendHtml = '<span class="legend-inline">' + opts.legend.map(([n,c]) =>
      `<span class="li"><span class="sw" data-sc="${c}"></span>${n}</span>`).join('') + '</span>';
  }
  label.innerHTML = `<span><span class="name">${name}</span>${legendHtml}</span><span class="stat">${opts.stat||''}</span>`;
  const c = document.createElement('canvas');
  c.className = 'strip-c';
  const h = opts.h || 46;
  c.style.height = h+'px';
  div.appendChild(label); div.appendChild(c);
  parent.appendChild(div);
  const strip = {canvas:c, ctx:c.getContext('2d'), h, draw:opts.draw, tip:opts.tip, name};
  strips.push(strip);
  hookInteractions(c);
  return strip;
}

// -- drawing helpers --------------------------------------------------------

function xOf(t, w){ return (t-view.t0)/(view.t1-view.t0)*w; }

function drawSpans(ctx, w, h, spans, fill){
  ctx.fillStyle = fill;
  for (const [a,b] of spans){
    if (b < view.t0 || a > view.t1) continue;
    const x1 = Math.max(0, xOf(a,w)), x2 = Math.min(w, xOf(Math.max(b,a+1),w));
    ctx.fillRect(x1, 0, Math.max(x2-x1,1), h);
  }
}

/// Dense series: envelope band + mean line. Sparse series (< 2 samples per
/// column on average) degrade to a plain polyline with point markers.
function drawSeries(ctx, w, h, ts, vs, yMax, colorKey, fillBand){
  const color = seriesColor(colorKey);
  const n = countInView(ts);
  if (n === 0) return;
  if (n >= w){
    const env = envelope(ts, vs, view.t0, view.t1, w);
    if (fillBand){
      ctx.fillStyle = color + '33';
      ctx.beginPath();
      let started = false;
      for (let c=0;c<w;c++){ if (!env.cnt[c]) continue;
        const y = h - Math.min(env.hi[c]/yMax,1)*h;
        if (!started){ ctx.moveTo(c, h); ctx.lineTo(c, y); started = true; } else ctx.lineTo(c, y);
      }
      if (started){ ctx.lineTo(w, h); ctx.closePath(); ctx.fill(); }
    } else {
      // min/max band so decimation cannot hide spikes
      ctx.fillStyle = color + '2e';
      for (let c=0;c<w;c++){ if (!env.cnt[c]) continue;
        const y1 = h - Math.min(env.hi[c]/yMax,1)*h;
        const y2 = h - Math.min(env.lo[c]/yMax,1)*h;
        ctx.fillRect(c, y1, 1, Math.max(y2-y1,1));
      }
    }
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
    let pen = false;
    for (let c=0;c<w;c++){
      if (!env.cnt[c]){ pen = false; continue; }
      const y = h - Math.min((env.sum[c]/env.cnt[c])/yMax,1)*h;
      if (!pen){ ctx.moveTo(c,y); pen = true; } else ctx.lineTo(c,y);
    }
    ctx.stroke();
  } else {
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
    let pen = false;
    let i = Math.max(0, lowerBound(ts, view.t0)-1);
    const pts = [];
    for (; i<ts.length && ts[i]<=view.t1+(view.t1-view.t0)/Math.max(w,1); i++){
      const v = vs[i];
      if (v===null||v===undefined||Number.isNaN(v)){ pen = false; continue; }
      const x = xOf(ts[i],w), y = h - Math.min(v/yMax,1)*h;
      if (!pen){ ctx.moveTo(x,y); pen = true; } else ctx.lineTo(x,y);
      pts.push([x,y]);
    }
    ctx.stroke();
    ctx.fillStyle = color;
    if (pts.length <= 200) for (const [x,y] of pts) { ctx.beginPath(); ctx.arc(x,y,2,0,7); ctx.fill(); }
    if (fillBand && pts.length){
      ctx.fillStyle = color + '22';
      ctx.beginPath(); ctx.moveTo(pts[0][0], h);
      for (const [x,y] of pts) ctx.lineTo(x,y);
      ctx.lineTo(pts[pts.length-1][0], h); ctx.closePath(); ctx.fill();
    }
  }
}

function countInView(ts){
  return lowerBound(ts, view.t1) - lowerBound(ts, view.t0);
}

/// Dots for point series {t, v} on a linear or log axis.
function drawDots(ctx, w, h, pts, scale, colorKey){
  const color = seriesColor(colorKey);
  ctx.fillStyle = color;
  for (const p of pts){
    if (p.t < view.t0 || p.t > view.t1) continue;
    const y = scale(p.v, h);
    if (y===null) continue;
    ctx.beginPath(); ctx.arc(xOf(p.t,w), y, 2.5, 0, 7); ctx.fill();
  }
}

/// Piecewise-constant step line for {t, v} change points.
function drawStep(ctx, w, h, pts, yMin, yMax, colorKey){
  if (!pts.length) return;
  const color = seriesColor(colorKey);
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
  const sy = v => h - (v-yMin)/((yMax-yMin)||1)*(h-8) - 4;
  let px = xOf(Math.max(pts[0].t, view.t0), w), py = sy(pts[0].v);
  ctx.moveTo(Math.max(px,0), py);
  for (let i=1;i<pts.length;i++){
    const x = xOf(pts[i].t, w);
    ctx.lineTo(x, py); py = sy(pts[i].v); ctx.lineTo(x, py);
  }
  ctx.lineTo(w, py); ctx.stroke();
}

function linScale(vMin, vMax){ return (v,h) => h - (v-vMin)/((vMax-vMin)||1)*(h-8) - 4; }
function logScale(vMin, vMax){
  const a = Math.log10(Math.max(vMin,1e-12)), b = Math.log10(Math.max(vMax,1e-11));
  return (v,h) => v<=0 ? null : h - (Math.log10(v)-a)/((b-a)||1)*(h-8) - 4;
}

function nearestPoint(pts, t){
  let best = null, dist = Infinity;
  for (const p of pts){ const d = Math.abs(p.t-t); if (d<dist){ dist = d; best = p; } }
  return best;
}
function sampleAt(ts, t){
  if (!ts.length) return -1;
  const i = lowerBound(ts, t);
  if (i<=0) return 0;
  if (i>=ts.length) return ts.length-1;
  return (t-ts[i-1] <= ts[i]-t) ? i-1 : i;
}

// ===========================================================================
// Page construction. Invoked at the bottom of the script, after every
// declaration below exists (the strip builders assign into them).
// ===========================================================================
const groupsDiv = document.getElementById('groups');

function buildPage(){
  // Idempotent: a live refresh rebuilds the whole page from the new data.
  strips.length = 0;
  groupsDiv.innerHTML = '';
  document.getElementById('kinds').innerHTML = '';
  if (!S.length && !E.length && !R.length){
    document.getElementById('empty').style.display = 'block';
  } else {
    document.getElementById('empty').style.display = 'none';
    buildKindToggles();
    buildGroups();
    buildSummary();
  }
  document.getElementById('chipDur').textContent = fmtMs(totalMs);
  document.getElementById('chipSamples').textContent = S.length + (R.length ? ` (+${R.length} rank)` : '');
  if (HOST){ const b = document.getElementById('hostBadge'); b.textContent = HOST; b.style.display = ''; }
}

function group(title, toggles){
  const g = document.createElement('div');
  g.className = 'group';
  const t = document.createElement('div');
  t.className = 'group-title';
  t.innerHTML = `<span>${title}</span>`;
  if (toggles) t.appendChild(toggles);
  g.appendChild(t);
  groupsDiv.appendChild(g);
  return g;
}

function buildGroups(){
  // Compute: one strip per local GPU, single percent axis (util %, VRAM as
  // % of the card's total; absolutes live in the tooltip).
  if (M.gpuIds.length){
    const g = group('Compute');
    for (const d of M.gpuIds){
      const G = M.gpu[d];
      addStrip(g, `GPU ${d}`, {
        h: 56,
        legend: [['util', seriesColor('util')], ['vram alloc', seriesColor('va')], ['vram used', seriesColor('vu')]],
        stat: G.vt ? `total ${fmtBytes(G.vt)}` : '',
        draw(ctx,w,h){
          drawSpans(ctx,w,h,G.idle,SHADE.idle);
          if (kindEnabled['sync']) drawSpans(ctx,w,h,M.syncSpans,SHADE.sync);
          if (kindEnabled['cpu_avg']) drawSpans(ctx,w,h,M.avgSpans,SHADE.cpu_avg);
          drawSeries(ctx,w,h,G.t,G.u,100,'util',true);
          drawSeries(ctx,w,h,G.t,G.vaPct,100,'va',false);
          drawSeries(ctx,w,h,G.t,G.vuPct,100,'vu',false);
        },
        tip(t){
          const i = sampleAt(G.t,t); if (i<0) return null;
          const s = S[i], gg = (s.gpus||[]).find(x=>x.d===d);
          if (!gg) return null;
          return `GPU ${d}: ${gg.u}%\nvram ${fmtBytes(gg.va)} alloc / ${fmtBytes(gg.vu)} used / ${fmtBytes(gg.vt)}`;
        },
      });
    }
  }

  // Engine: what ElChe was doing. Anchor level and the round-trip costs it
  // was reacting to, each on its own axis. Each strip answers to its
  // kind's toggle.
  const showAnchor = M.anchor.length && kindEnabled['anchor'];
  const showSync = M.syncMs.length && kindEnabled['sync'];
  const showAvg = M.avgMs.length && kindEnabled['cpu_avg'];
  if (showAnchor || showSync || showAvg){
    const g = group('Engine');
    if (showAnchor){
      const vals = M.anchor.map(p=>p.v);
      const lo = Math.min(...vals), hi = Math.max(...vals);
      addStrip(g, 'anchor (batches)', {
        stat: `now ${vals[vals.length-1]} · range ${lo}–${hi}`,
        draw(ctx,w,h){ drawStep(ctx,w,h,M.anchor,Math.min(lo,0),hi*1.05||1,'anchor'); },
        tip(t){
          let v = M.anchor[0].v;
          for (const p of M.anchor){ if (p.t<=t) v = p.v; else break; }
          return `anchor: ${v}`;
        },
      });
    }
    const dur = (showSync?M.syncMs:[]).concat(showAvg?M.avgMs:[]);
    if (dur.length){
      const hi = Math.max(...dur.map(p=>p.v));
      const scale = linScale(0, hi*1.1||1);
      addStrip(g, 'sync duration (ms)', {
        legend: [['allreduce', seriesColor('syncMs')], ['cpu avg', seriesColor('avgMs')]],
        stat: (showSync?`${M.syncMs.length} syncs`:'') + (showAvg?` · ${M.avgMs.length} cpu avgs`:''),
        draw(ctx,w,h){
          if (showSync) drawDots(ctx,w,h,M.syncMs,scale,'syncMs');
          if (showAvg) drawDots(ctx,w,h,M.avgMs,scale,'avgMs');
        },
        tip(t){
          const p = nearestPoint(dur,t);
          return p ? `sync ${p.v.toFixed(1)}ms` : null;
        },
      });
    }
  }

  // Convergence: divergence level (log) and its growth rate. The d and
  // lambda strips answer to the divergence toggle, the per-key strips to
  // the guard toggle.
  const showDiv = M.d.length && kindEnabled['div'];
  const showGuard = M.guardKeys.length && kindEnabled['guard_telemetry'];
  if (showDiv || showGuard){
    const g = group('Convergence');
    if (showDiv){
    const dv = M.d.map(p=>p.v).filter(v=>v>0);
    const scale = logScale(Math.min(...dv), Math.max(...dv));
    addStrip(g, 'divergence d (log)', {
      stat: dv.length?`${fmtVal(Math.min(...dv))} … ${fmtVal(Math.max(...dv))}`:'',
      draw(ctx,w,h){ drawDots(ctx,w,h,M.d,scale,'d'); },
      tip(t){
        const p = nearestPoint(M.d,t); if (!p) return null;
        let s = `d = ${fmtVal(p.v)} (step ${p.ev.step})`;
        if (p.ev.lambda_ema!==undefined) s += `\nλ_ema = ${fmtVal(p.ev.lambda_ema)}`;
        if (p.ev.deltas) s += `\nrank deltas: ${p.ev.deltas.map(fmtVal).join(', ')}`;
        return s;
      },
    });
    if (M.lambda.length){
      const lv = M.lambda.map(p=>p.v);
      const lo = Math.min(...lv,0), hi = Math.max(...lv,0);
      addStrip(g, 'λ_ema (growth rate)', {
        stat: `last ${fmtVal(lv[lv.length-1])}`,
        draw(ctx,w,h){
          const sy = linScale(lo, hi===lo?lo+1:hi);
          // zero line: growth above, decay below
          ctx.strokeStyle = css('--line'); ctx.lineWidth = 1;
          const y0 = sy(0,h); ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(w,y0); ctx.stroke();
          drawSeries(ctx,w,h,M.lambda.map(p=>p.t),lv.map(v=>v-lo),(hi-lo)||1,'lambda',false);
        },
        tip(t){ const p = nearestPoint(M.lambda,t); return p?`λ_ema = ${fmtVal(p.v)}`:null; },
      });
    }
    }
    if (showGuard) for (const key of M.guardKeys){
      const pts = M.guard(key);
      if (!pts.length) continue;
      const vs = pts.map(p=>p.v);
      const lo = Math.min(...vs), hi = Math.max(...vs);
      addStrip(g, `guard: ${key}`, {
        stat: `last ${fmtVal(vs[vs.length-1])}`,
        h: 36,
        draw(ctx,w,h){ drawSeries(ctx,w,h,pts.map(p=>p.t),vs.map(v=>v-lo),(hi-lo)||1,'lambda',false); },
        tip(t){ const p = nearestPoint(pts,t); return p?`${key} = ${fmtVal(p.v)}`:null; },
      });
    }
  }

  // Training: the run's outcome curves, from epoch events.
  if (M.loss.length && kindEnabled['epoch']){
    const g = group('Training');
    const lv = M.loss.map(p=>p.v);
    const lo = Math.min(...lv), hi = Math.max(...lv);
    addStrip(g, 'loss (epoch end)', {
      stat: `last ${fmtVal(lv[lv.length-1])}`,
      draw(ctx,w,h){
        drawSeries(ctx,w,h,M.loss.map(p=>p.t),lv.map(v=>v-lo),(hi-lo)||1,'loss',false);
        drawDots(ctx,w,h,M.loss.map(p=>({t:p.t,v:p.v-lo})),linScale(0,(hi-lo)||1),'loss');
      },
      tip(t){ const p = nearestPoint(M.loss,t); return p?`epoch ${p.epoch}: loss ${fmtVal(p.v)}`:null; },
    });
    const rv = M.lr.map(p=>p.v);
    if (rv.length && Math.min(...rv)!==Math.max(...rv)){
      addStrip(g, 'learning rate', {
        h: 36,
        stat: `last ${fmtVal(rv[rv.length-1])}`,
        draw(ctx,w,h){ drawStep(ctx,w,h,M.lr,Math.min(...rv),Math.max(...rv),'lr'); },
        tip(t){ const p = nearestPoint(M.lr,t); return p?`lr ${fmtVal(p.v)}`:null; },
      });
    }
  }

  // Host: context, one compact percent strip.
  if (S.length){
    const g = group('Host');
    addStrip(g, HOST ? `cpu / ram · ${HOST}` : 'cpu / ram', {
      legend: [['cpu', seriesColor('cpu')], ['ram', seriesColor('ram')]],
      stat: M.ramTotal?`ram total ${fmtBytes(M.ramTotal)}`:'',
      draw(ctx,w,h){
        if (kindEnabled['cpu_avg']) drawSpans(ctx,w,h,M.avgSpans,SHADE.cpu_avg);
        drawSeries(ctx,w,h,M.t,M.cpu,100,'cpu',true);
        drawSeries(ctx,w,h,M.t,M.ramPct,100,'ram',false);
      },
      tip(t){
        const i = sampleAt(M.t,t); if (i<0) return null;
        const s = S[i];
        return `cpu ${s.cpu.toFixed(1)}%\nram ${fmtBytes(s.ram[0])} / ${fmtBytes(s.ram[1])}`;
      },
    });
  }

  // Remote ranks (controller page): sparse host-qualified strips from the
  // metrics-cadence rank samples.
  if (M.ranks.size){
    const g = group('Remote ranks (metrics cadence)');
    const ordered = [...M.ranks.entries()].sort((a,b)=>a[1].rank-b[1].rank || a[0].localeCompare(b[0]));
    for (const [key, e] of ordered){
      const gpuList = [...e.gpus.entries()];
      addStrip(g, key, {
        h: 40,
        legend: [['gpu util', seriesColor('util')], ['vram', seriesColor('va')], ['cpu', seriesColor('cpu')]],
        stat: gpuList.length&&gpuList[0][1].vt?`gpu${gpuList[0][0]} · ${fmtBytes(gpuList[0][1].vt)}`:'',
        draw(ctx,w,h){
          if (kindEnabled['sync']) drawSpans(ctx,w,h,M.syncSpans,SHADE.sync);
          for (const [,gg] of gpuList){
            drawSeries(ctx,w,h,e.t,gg.u,100,'util',false);
            drawSeries(ctx,w,h,e.t,gg.vaPct,100,'va',false);
          }
          drawSeries(ctx,w,h,e.t,e.cpu,100,'cpu',false);
        },
        tip(t){
          const i = sampleAt(e.t,t); if (i<0) return null;
          const parts = [key];
          for (const [d,gg] of gpuList){
            if (gg.u[i]!==null) parts.push(`gpu${d} ${gg.u[i].toFixed(0)}%` + (gg.vaPct[i]!==null?` vram ${gg.vaPct[i].toFixed(0)}%`:''));
          }
          if (e.cpu[i]!==null) parts.push(`cpu ${e.cpu[i].toFixed(0)}%`);
          return parts.join('\n');
        },
      });
    }
  }

  // Event strip: every kind as ticks, toggled from the bar above.
  addEventStrip();
  applySwatches();
}

let eventStrip = null;
function addEventStrip(){
  const g = group('Events');
  eventStrip = addStrip(g, 'event strip', {
    h: 30,
    draw(ctx,w,h){
      for (const e of E){
        const fam = kindFamily(e.k);
        if (!fam || !kindEnabled[fam]) continue;
        if (e.t < view.t0 || e.t > view.t1) continue;
        const meta = KIND_META.find(m=>m[0]===fam);
        ctx.strokeStyle = meta ? kindColor(meta[2]) : css('--muted');
        ctx.lineWidth = 1;
        const x = xOf(e.t,w);
        ctx.beginPath(); ctx.moveTo(x, e.k.endsWith('_end')?h/2:2); ctx.lineTo(x, e.k.endsWith('_end')?h-2:h/2); ctx.stroke();
      }
      // epoch boundaries get a label when sparse enough
      if (kindEnabled['epoch']){
        const starts = M.epochStarts.filter(e=>e.t>=view.t0&&e.t<=view.t1);
        if (starts.length && starts.length <= 60){
          ctx.fillStyle = css('--muted'); ctx.font = '9px '+css('--mono');
          for (const e of starts) ctx.fillText('e'+e.epoch, xOf(e.t,w)+2, 9);
        }
      }
    },
    tip(t){
      const radius = (view.t1-view.t0)*0.01;
      const near = E.filter(e=>{
        const fam = kindFamily(e.k);
        return fam && kindEnabled[fam] && Math.abs(e.t-t)<radius;
      }).slice(0,8);
      if (!near.length) return null;
      return near.map(fmtEvent).join('\n');
    },
  });
}

function fmtEvent(e){
  switch(e.k){
    case 'epoch_start': return `${fmtMs(e.t)} epoch ${e.epoch} start`;
    case 'epoch_end': return `${fmtMs(e.t)} epoch ${e.epoch} end loss=${fmtVal(e.loss)} lr=${fmtVal(e.lr)}`;
    case 'sync_start': return `${fmtMs(e.t)} allreduce start`;
    case 'sync_end': return `${fmtMs(e.t)} allreduce end (${e.ms.toFixed(1)}ms)`;
    case 'cpu_avg_start': return `${fmtMs(e.t)} cpu averaging start`;
    case 'cpu_avg_end': return `${fmtMs(e.t)} cpu averaging end (${e.ms.toFixed(1)}ms)`;
    case 'anchor': return `${fmtMs(e.t)} anchor ${e.from} → ${e.to}`;
    case 'throttle': return `${fmtMs(e.t)} throttle rank ${e.rank}`;
    case 'meta_nudge': return `${fmtMs(e.t)} meta nudge ×${e.factor} (${e.from} → ${e.to})`;
    case 'lost_broadcast': return `${fmtMs(e.t)} lost broadcast ${e.control} (${e.failures} ranks)`;
    case 'div': return `${fmtMs(e.t)} d=${fmtVal(e.d)}`;
    case 'guard_telemetry': return `${fmtMs(e.t)} guard ${Object.entries(e.values||{}).map(([k,v])=>k+'='+fmtVal(v)).join(' ')}`;
    case 'div_epoch': return `${fmtMs(e.t)} epoch ${e.epoch} div: mean ${fmtVal(e.d_mean)} (${e.syncs} syncs)`;
    default: return `${fmtMs(e.t)} ${e.k}`;
  }
}

function buildKindToggles(){
  const present = new Set(E.map(e=>kindFamily(e.k)).filter(Boolean));
  const bar = document.getElementById('kinds');
  const lead = document.createElement('span');
  lead.textContent = 'show:';
  bar.appendChild(lead);
  for (const [key,label,colorSpec,def] of KIND_META){
    // A live refresh keeps the user's toggle choices.
    if (!(key in kindEnabled)) kindEnabled[key] = def;
    const on = kindEnabled[key];
    if (!present.has(key)) continue;
    const l = document.createElement('label');
    const n = E.filter(e=>kindFamily(e.k)===key).length;
    l.innerHTML = `<input type="checkbox" ${on?'checked':''}> <span class="sw" data-kc="${key}"></span>${label} <span style="opacity:.6">${n}</span>`;
    if (!on) l.style.opacity = '0.45';
    // A kind's toggle governs EVERYTHING derived from that kind — its
    // strips, its span shading, and its event-strip ticks — so every
    // click has a visible effect (ticks alone can be sub-pixel subtle).
    l.querySelector('input').addEventListener('change', ev=>{
      kindEnabled[key] = ev.target.checked;
      l.style.opacity = ev.target.checked ? '' : '0.45';
      rebuild();
    });
    bar.appendChild(l);
  }
  applyKindSwatches();
}

function applySwatches(){
  document.querySelectorAll('.sw[data-sc]').forEach(el=>{ el.style.background = el.dataset.sc; });
  applyKindSwatches();
}
function applyKindSwatches(){
  document.querySelectorAll('.sw[data-kc]').forEach(el=>{
    const meta = KIND_META.find(m=>m[0]===el.dataset.kc);
    el.style.background = meta ? kindColor(meta[2]) : css('--muted');
  });
}

function rebuild(){
  strips.length = 0;
  groupsDiv.innerHTML = '';
  buildGroups();
  render();
}

// ===========================================================================
// Summary.
// ===========================================================================
function buildSummary(){
  const rows = [];
  rows.push(['Duration', fmtMs(totalMs)]);
  rows.push(['Samples', `${S.length} local` + (R.length?` + ${R.length} rank-reported`:'')]);
  const epochs = E.filter(e=>e.k==='epoch_end').length;
  if (epochs) rows.push(['Epochs', epochs]);
  if (M.syncMs.length){
    const avg = M.syncMs.reduce((a,p)=>a+p.v,0)/M.syncMs.length;
    rows.push(['Syncs', `${M.syncMs.length} (avg ${avg.toFixed(1)}ms)`]);
  }
  if (M.avgMs.length){
    const avg = M.avgMs.reduce((a,p)=>a+p.v,0)/M.avgMs.length;
    rows.push(['CPU averagings', `${M.avgMs.length} (avg ${avg.toFixed(1)}ms)`]);
  }
  const anchors = E.filter(e=>e.k==='anchor').length;
  if (anchors) rows.push(['Anchor changes', anchors]);
  const throttles = E.filter(e=>e.k==='throttle').length;
  if (throttles) rows.push(['Throttles', throttles]);
  const lost = E.filter(e=>e.k==='lost_broadcast').length;
  if (lost) rows.push(['Lost broadcasts', lost]);
  for (const d of M.gpuIds){
    const G = M.gpu[d];
    let idle = 0, tot = 0;
    for (const u of G.u){ if (u===null) continue; tot++; if (u<5) idle++; }
    if (tot) rows.push([`GPU ${d} idle`, `${(idle/tot*100).toFixed(1)}% of samples < 5%`]);
  }
  if (M.d.length){
    const dv = M.d.map(p=>p.v);
    rows.push(['Divergence d', `${fmtVal(Math.min(...dv))} … ${fmtVal(Math.max(...dv))} over ${dv.length} syncs`]);
  }
  if (M.lambda.length) rows.push(['λ_ema at end', fmtVal(M.lambda[M.lambda.length-1].v)]);
  const el = document.getElementById('summary');
  el.style.display = '';
  document.getElementById('summaryBody').innerHTML =
    '<table>' + rows.map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join('') + '</table>';
}

// ===========================================================================
// Render loop: axis + every strip, one shared view window.
// ===========================================================================
const axis = document.getElementById('axis');
const axisCtx = axis.getContext('2d');
hookInteractions(axis);

function render(){
  renderAxis();
  for (const s of strips){
    const w = s.canvas.parentElement.clientWidth;
    s.canvas.width = w*DPR; s.canvas.height = s.h*DPR;
    s.canvas.style.width = w+'px';
    const ctx = s.ctx;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,w,s.h);
    s.draw(ctx,w,s.h);
    drawCursor(ctx,w,s.h);
    drawDrag(ctx,w,s.h,s.canvas);
  }
  const zoomed = view.t0>0 || view.t1<totalMs;
  document.getElementById('chipView').innerHTML = zoomed
    ? `view <b>${fmtMs(view.t0)} – ${fmtMs(view.t1)}</b>` : '';
}

function renderAxis(){
  const w = axis.parentElement.clientWidth - 0;
  axis.width = w*DPR; axis.height = 26*DPR;
  axis.style.width = w+'px';
  const ctx = axisCtx;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,w,26);
  const span = view.t1-view.t0;
  // 1-2-5 tick progression sized to ~90px spacing.
  let step = Math.pow(10, Math.floor(Math.log10(span/ (w/90) )));
  if (span/step > w/45) step *= 5; else if (span/step > w/90) step *= 2;
  ctx.strokeStyle = css('--line'); ctx.fillStyle = css('--muted');
  ctx.font = '10px '+css('--mono');
  for (let t = Math.ceil(view.t0/step)*step; t <= view.t1; t += step){
    const x = xOf(t,w);
    ctx.beginPath(); ctx.moveTo(x,18); ctx.lineTo(x,26); ctx.stroke();
    ctx.fillText(fmtMs(t), x+3, 14);
  }
  drawCursor(ctx,w,26);
}

function drawCursor(ctx,w,h){
  if (cursorT===null || cursorT<view.t0 || cursorT>view.t1) return;
  ctx.strokeStyle = css('--muted'); ctx.lineWidth = 1; ctx.setLineDash([2,3]);
  const x = xOf(cursorT,w);
  ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
  ctx.setLineDash([]);
}

// ===========================================================================
// Interactions: drag-select zoom, wheel zoom, double-click reset, linked
// crosshair + tooltip.
// ===========================================================================
let drag = null; // {canvas, x0, x1}
const tooltip = document.getElementById('tooltip');

function tAtEvent(ev, el){
  const r = el.getBoundingClientRect();
  return view.t0 + (ev.clientX-r.left)/r.width*(view.t1-view.t0);
}

function hookInteractions(c){
  c.addEventListener('mousedown', ev=>{
    drag = {canvas:c, x0:ev.clientX, x1:ev.clientX};
    ev.preventDefault();
  });
  c.addEventListener('dblclick', ()=>{ view = {t0:0, t1:totalMs}; render(); });
  c.addEventListener('wheel', ev=>{
    ev.preventDefault();
    const t = tAtEvent(ev, c);
    const f = ev.deltaY > 0 ? 1.25 : 0.8;
    let t0 = t - (t-view.t0)*f, t1 = t + (view.t1-t)*f;
    t0 = Math.max(0, t0); t1 = Math.min(totalMs, t1);
    if (t1-t0 >= 50){ view = {t0, t1}; render(); }
  }, {passive:false});
}

document.addEventListener('mousemove', ev=>{
  if (drag){
    drag.x1 = ev.clientX;
    render();
    return;
  }
  const el = ev.target;
  if (!(el instanceof HTMLCanvasElement)){
    if (cursorT!==null){ cursorT = null; render(); }
    tooltip.style.display = 'none';
    return;
  }
  cursorT = tAtEvent(ev, el);
  const strip = strips.find(s=>s.canvas===el);
  let text = fmtMs(cursorT);
  if (strip && strip.tip){
    const t = strip.tip(cursorT);
    if (t) text += '\n'+t;
  }
  tooltip.textContent = text;
  tooltip.style.display = 'block';
  tooltip.style.left = Math.min(ev.clientX+14, window.innerWidth-360)+'px';
  tooltip.style.top = (ev.clientY+14)+'px';
  render();
});

document.addEventListener('mouseup', ev=>{
  if (!drag) return;
  const r = drag.canvas.getBoundingClientRect();
  const a = Math.min(drag.x0, drag.x1), b = Math.max(drag.x0, drag.x1);
  drag = null;
  if (b-a > 6){
    const t0 = view.t0 + (a-r.left)/r.width*(view.t1-view.t0);
    const t1 = view.t0 + (b-r.left)/r.width*(view.t1-view.t0);
    if (t1-t0 >= 50) view = {t0:Math.max(0,t0), t1:Math.min(totalMs,t1)};
  }
  render();
});

function drawDrag(ctx,w,h,canvas){
  if (!drag || drag.canvas!==canvas) return;
  const r = canvas.getBoundingClientRect();
  const a = Math.min(drag.x0,drag.x1)-r.left, b = Math.max(drag.x0,drag.x1)-r.left;
  ctx.fillStyle = 'rgba(121,134,203,0.15)';
  ctx.fillRect(a,0,b-a,h);
  ctx.strokeStyle = css('--actor');
  ctx.strokeRect(a+0.5,0.5,b-a-1,h-1);
}

document.getElementById('resetBtn').addEventListener('click', ()=>{ view={t0:0,t1:totalMs}; render(); });
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('flodl-theme', next); } catch(e) {}
  applySwatches();
  render();
});

window.addEventListener('resize', render);

// Boot: injected consts make the static artifact; served with ?host= the
// page fetches the shipped stream and auto-refreshes on the shipper's
// clock while its tab is visible.
const FETCH_HOST = new URLSearchParams(location.search).get('host');
if (FETCH_HOST && typeof TIMELINE_SAMPLES === 'undefined'){
  liveRefresh();
} else {
  setData(
    typeof TIMELINE_SAMPLES      !== 'undefined' ? TIMELINE_SAMPLES      : [],
    typeof TIMELINE_EVENTS       !== 'undefined' ? TIMELINE_EVENTS       : [],
    typeof TIMELINE_RANK_SAMPLES !== 'undefined' ? TIMELINE_RANK_SAMPLES : [],
    typeof TIMELINE_HOST         !== 'undefined' ? TIMELINE_HOST         : null,
  );
  buildPage();
  render();
}

async function liveRefresh(){
  // The catch owns NETWORK failures only (keep the last good view, retry
  // next tick); a rendering bug must surface, not silently retry.
  let text = null;
  try {
    const run = new URLSearchParams(location.search).get('run');
    const url = '/timeline/data?host=' + encodeURIComponent(FETCH_HOST) +
      (run ? '&run=' + encodeURIComponent(run) : '');
    const resp = await fetch(url);
    if (resp.ok) text = await resp.text();
    else if (!S.length){
      const el = document.getElementById('empty');
      el.textContent = 'No shipped telemetry for "' + FETCH_HOST +
        '" yet — the shipper publishes within a few seconds of the first samples.';
      el.style.display = 'block';
    }
  } catch (e) { /* transient fetch error */ }
  if (text !== null){
    const {s, e, r} = parseJsonl(text);
    setData(s, e, r, FETCH_HOST);
    buildPage();
    render();
  }
  setTimeout(() => {
    if (document.visibilityState === 'visible') liveRefresh();
    else document.addEventListener('visibilitychange', function once(){
      document.removeEventListener('visibilitychange', once);
      liveRefresh();
    }, {once:true});
  }, 10000);
}
</script>
